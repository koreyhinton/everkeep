<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ever Keep</title>
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
    </style>
</head>
<body>
    <!-- oncontextmenu keeps right-click (move units) from opening the browser menu -->
    <canvas id="glcanvas" tabindex='1' oncontextmenu="return false"></canvas>
    <!-- Minified and statically hosted version of https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/not-fl3/sapp-jsutils@master/js/sapp_jsutils.js"></script>
    <!-- orc ws browser plugin (websockets for multiplayer), copied here by build-web.sh -->
    <script src="orc_ws.js"></script>
    <script>load("everkeep.wasm");</script> <!-- Your compiled WASM binary -->
</body>
</html>
